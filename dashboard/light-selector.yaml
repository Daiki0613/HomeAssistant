type: grid
columns: 4
square: false
cards:
  - type: custom:button-card
    name: Energize
    icon: mdi:lightbulb
    styles:
      card:
        - background-color: "#f7ffff"
        - border-radius: 12px
        - padding: 16px 8px
      name:
        - color: white
        - font-size: 13px
        - font-weight: 500
        - text-shadow: 0 1px 3px rgba(0,0,0,0.4)
      icon:
        - color: white
        - width: 28px
        - filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3))
    tap_action:
      action: call-service
      service: scene_presets.apply_preset
      service_data:
        preset_id: 0eeacfc5-2d81-4035-a23d-4a9bc02af965
        targets:
          entity_id: light.living_room_lights
        shuffle: true
        smart_shuffle: true
