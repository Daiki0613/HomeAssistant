blueprint:
  name: Styrbar remote
  description: >
    IKEA STYRBAR over Zigbee2MQTT.

    - "on"  toggles the ON target (lights and/or switches)
    - "off" toggles the OFF target (lights and/or switches)
    - "arrow_left_click"  dims the brightness target
    - "arrow_right_click" brightens the brightness target

    Triggers on the raw Zigbee2MQTT payload rather than on an entity.
    Zigbee2MQTT 2.0 removed the action sensor this blueprint used to take, and
    the entity representation has now changed twice (action sensor, then device
    triggers, then opt-in event entities) while the published payload has not.

    ON/OFF targets can be entities, groups, devices or areas containing
    lights and/or switches. Brightness target is lights only; if empty,
    the arrow buttons do nothing.
  domain: automation
  source_url: https://raw.githubusercontent.com/Daiki0613/HomeAssistant/main/styrbar.yaml

  input:
    remote_topic:
      name: STYRBAR MQTT topic
      description: >
        The remote's Zigbee2MQTT topic: the base topic plus the device's
        friendly name, e.g. zigbee2mqtt/Styrbar. It must match the friendly
        name in the Zigbee2MQTT frontend exactly, capitalisation included.
      default: zigbee2mqtt/Styrbar
      selector:
        text:

    on_target:
      name: Target for ON button
      description: >
        Target to toggle when ON is pressed (entity, group, device or area)
        containing lights and/or switches.
      selector:
        target:
          entity:
            domain:
              - light
              - switch

    off_target:
      name: Target for OFF button
      description: >
        Target to toggle when OFF is pressed (entity, group, device or area)
        containing lights and/or switches.
      selector:
        target:
          entity:
            domain:
              - light
              - switch

    brightness_target:
      name: Brightness target (optional)
      description: >
        Light target whose brightness will be changed by the arrow buttons.
        If left empty, arrow buttons do nothing.
      default: {}
      selector:
        target:
          entity:
            domain: light

    brightness_step:
      name: Brightness step (%)
      description: >
        How much to change brightness per arrow click.
        Left arrow = -step, Right arrow = +step.
      default: 20
      selector:
        number:
          min: 1
          max: 100
          mode: slider
          unit_of_measurement: "%"

mode: restart
max_exceeded: silent

trigger:
  # Every state update lands on this topic, so the templates default to an
  # empty string for the messages that carry no action at all.
  - platform: mqtt
    topic: !input remote_topic
    value_template: "{{ value_json.action | default('') }}"
    payload: "on"
    id: press_on

  - platform: mqtt
    topic: !input remote_topic
    value_template: "{{ value_json.action | default('') }}"
    payload: "off"
    id: press_off

  - platform: mqtt
    topic: !input remote_topic
    value_template: "{{ value_json.action | default('') }}"
    payload: "arrow_left_click"
    id: arrow_left

  - platform: mqtt
    topic: !input remote_topic
    value_template: "{{ value_json.action | default('') }}"
    payload: "arrow_right_click"
    id: arrow_right

variables:
  brightness_step: !input brightness_step
  brightness_target: !input brightness_target
  has_brightness_target: "{{ brightness_target | length > 0 }}"

action:
  - choose:
      # ─── ON button: toggle ON target ───
      - conditions:
          - condition: trigger
            id: press_on
        sequence:
          - service: homeassistant.toggle
            target: !input on_target

      # ─── OFF button: toggle OFF target ───
      - conditions:
          - condition: trigger
            id: press_off
        sequence:
          - service: homeassistant.toggle
            target: !input off_target

      # ─── LEFT arrow: dim brightness target ───
      - conditions:
          - condition: trigger
            id: arrow_left
        sequence:
          - if:
              - condition: template
                value_template: "{{ has_brightness_target }}"
            then:
              - service: light.turn_on
                target: !input brightness_target
                data:
                  brightness_step_pct: "{{ (brightness_step | int) * -1 }}"

      # ─── RIGHT arrow: brighten brightness target ───
      - conditions:
          - condition: trigger
            id: arrow_right
        sequence:
          - if:
              - condition: template
                value_template: "{{ has_brightness_target }}"
            then:
              - service: light.turn_on
                target: !input brightness_target
                data:
                  brightness_step_pct: "{{ brightness_step | int }}"
    default: []
